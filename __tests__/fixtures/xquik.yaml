openapi: '3.1.0'
info:
  version: '1.0'
  title: Xquik API fixture
servers:
  - url: https://xquik.com
paths:
  /api/v1/x/tweets/search:
    get:
      summary: Search public X posts
      operationId: searchTweets
      tags:
        - x
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          example: from:xquik
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
          example: 25
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  tweets:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        text:
                          type: string
                  has_next_page:
                    type: boolean
                  next_cursor:
                    type: string
      security:
        - XquikApiKey: []
components:
  securitySchemes:
    XquikApiKey:
      type: apiKey
      name: x-api-key
      in: header
